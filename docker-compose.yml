services:
  triton:
    image: nvcr.io/nvidia/tritonserver:25.10-py3
    container_name: thaokb_triton
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ./workspace/triton_model_repo:/models
    command: >
      tritonserver --model-repository=/models
      --allow-http=true --http-port=8100
      --allow-grpc=true --grpc-port=8101
      --allow-metrics=true --metrics-port=8102
    network_mode: host
    shm_size: 1g
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped

  ds9-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepstream:9.0-triton
    container_name: thaokb_ds9
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/workspace
    network_mode: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    stdin_open: true
    tty: true
    restart: unless-stopped
